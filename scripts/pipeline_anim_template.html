<script>
const D = /*DATA*/null;
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ccol = k => css("--c" + k);
const fmt = (x, d = 2) => Number(x).toFixed(d);

function el(tag, attrs = {}, parent = svg, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e);
  return e;
}
function g(attrs = {}, parent = svg) { return el("g", attrs, parent); }
function anim(node, cls, delay = 0) {
  node.classList.add(cls);
  node.style.animationDelay = delay + "ms";
  node.style.transformOrigin = "center"; node.style.transformBox = "fill-box";
  return node;
}
function hex2rgb(h) { h = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`; }

// heat strip: a vector drawn as a row of cells (sequential for >=0, diverging otherwise)
function strip(vals, x, y, w, h, parent = svg, opts = {}) {
  const gg = g({}, parent);
  const lo = css("--seq0"), hi = opts.color || css("--seq1"), neg = css("--warn");
  const m = opts.max || Math.max(...vals.map(Math.abs)) || 1;
  const n = vals.length, cw = w / n;
  // merge runs into fewer rects for speed
  for (let i = 0; i < n; i++) {
    const v = vals[i] / m;
    const c = v >= 0 ? mix(lo, hi, Math.min(1, v)) : mix(lo, neg, Math.min(1, -v));
    el("rect", { x: x + i * cw, y, width: cw + 0.35, height: h, fill: c }, gg);
  }
  el("rect", { x, y, width: w, height: h, fill: "none", stroke: css("--line") }, gg);
  return gg;
}
function img(href, x, y, s, parent = svg) {
  return el("image", { href, x, y, width: s, height: s, style: "image-rendering:pixelated" }, parent);
}
function label(x, y, t, parent = svg, attrs = {}) { return el("text", { x, y, "font-size": 14, ...attrs }, parent, t); }
function arrow(x1, y1, x2, y2, parent = svg, color) {
  const c = color || css("--muted");
  el("line", { x1, y1, x2, y2, stroke: c, "stroke-width": 2 }, parent);
  const a = Math.atan2(y2 - y1, x2 - x1), s = 9;
  el("path", { d: `M${x2},${y2} L${x2 - s * Math.cos(a - .45)},${y2 - s * Math.sin(a - .45)} L${x2 - s * Math.cos(a + .45)},${y2 - s * Math.sin(a + .45)} Z`, fill: c }, parent);
}
function box(x, y, w, h, title, sub, parent = svg, fill) {
  const gg = g({}, parent);
  el("rect", { x, y, width: w, height: h, rx: 10, fill: fill || css("--bg"), stroke: css("--line"), "stroke-width": 1.5 }, gg);
  label(x + w / 2, y + h / 2 - (sub ? 4 : -5), title, gg, { "text-anchor": "middle", "font-size": 17, "font-weight": 600 });
  if (sub) label(x + w / 2, y + h / 2 + 18, sub, gg, { "text-anchor": "middle", "font-size": 13, class: "muted" });
  return gg;
}
function cosBetween(rows, labels) {
  const n = rows.map(r => { const s = Math.hypot(...r); return r.map(v => v / s); });
  let tot = 0, cnt = 0;
  for (let i = 0; i < n.length; i++) for (let j = 0; j < n.length; j++) if (labels[i] !== labels[j]) {
    let d = 0; for (let k = 0; k < n[i].length; k++) d += n[i][k] * n[j][k]; tot += d; cnt++;
  }
  return tot / cnt;
}
const NODE = D.node_class.map((c, i) => ({ c, v: D.node_view[i] }));
const P0 = { x: 470, y: 70, w: 660, h: 520 };   // scatter plot frame
const sx = p => P0.x + 30 + p[0] * (P0.w - 60), sy = p => P0.y + 30 + (1 - p[1]) * (P0.h - 60);
const viewShape = ["circle", "rect", "diamond", "triangle"];
function marker(kind, x, y, r, fill, parent) {
  if (kind === "circle") return el("circle", { cx: x, cy: y, r, fill, stroke: css("--panel"), "stroke-width": 1.5 }, parent);
  if (kind === "rect") return el("rect", { x: x - r, y: y - r, width: 2 * r, height: 2 * r, fill, stroke: css("--panel"), "stroke-width": 1.5 }, parent);
  const pts = kind === "diamond" ? [[0, -r * 1.25], [r * 1.25, 0], [0, r * 1.25], [-r * 1.25, 0]] : [[0, -r * 1.3], [r * 1.2, r], [-r * 1.2, r]];
  return el("polygon", { points: pts.map(p => `${x + p[0]},${y + p[1]}`).join(" "), fill, stroke: css("--panel"), "stroke-width": 1.5 }, parent);
}
function legendClasses(x, y, parent = svg) {
  D.classes.forEach((n, k) => {
    el("circle", { cx: x, cy: y + k * 24, r: 7, fill: ccol(k) }, parent);
    label(x + 14, y + k * 24 + 5, n, parent);
  });
  D.view_names.forEach((n, m) => {
    marker(viewShape[m], x + 6, y + 140 + m * 24, 6, css("--muted"), parent);
    label(x + 20, y + 145 + m * 24, "view: " + n, parent, { "font-size": 13, class: "muted" });
  });
}
function scatterFrame(parent = svg, title) {
  el("rect", { x: P0.x, y: P0.y, width: P0.w, height: P0.h, rx: 8, fill: "none", stroke: css("--line"), "stroke-dasharray": "4 5" }, parent);
  label(P0.x + 12, P0.y + 22, title, parent, { "font-size": 13, class: "muted" });
}
let raf = 0;
function tween(ms, fn, done) {
  cancelAnimationFrame(raf);
  if (reduce) { fn(1); done && done(); return; }
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    fn(e);
    if (t < 1) raf = requestAnimationFrame(step); else done && done();
  };
  raf = requestAnimationFrame(step);
}
const novelIdx = k => D.n_base + k;

// ---------------------------------------------------------------- stages
const STAGES = [
{ short: "Input", eye: "Stage 1 · few-shot input", title: "Five new classes, five images each",
  text: "Session 1 adds five classes the backbone never trained on. Each arrives with only the five official labelled images.",
  shape: "support set  (5 classes, 5 shots, 3, 32, 32)",
  facts: () => [["new classes this session", "5"], ["images per class", "5"], ["base classes already known", "60"]],
  draw() {
    D.classes.forEach((n, k) => {
      const y = 70 + k * 112;
      label(70, y + 52, n, svg, { "font-size": 20, "font-weight": 600, fill: ccol(k) });
      D.support[k].forEach((u, s) => anim(img(u, 300 + s * 112, y, 96), "pop", k * 90 + s * 45));
    });
    label(300, 650, "real CIFAR-100 training images (32 × 32 px, shown enlarged)", svg, { "font-size": 13, class: "muted" });
  } },
{ short: "Views", eye: "Stage 2 · fantasy views", title: "Each image becomes four deterministic views",
  text: "Fixed transforms (identity, horizontal flip, 15° rotation, 0.8× zoom) turn 25 images into 100. The same views are produced every time, so the graph always sees the same nodes.",
  shape: "views  (5, 5, M=4, 3, 32, 32)  →  100 images",
  facts: () => [["views per image", D.views], ["images entering the backbone", 5 * 5 * D.views]],
  draw() {
    D.classes.forEach((n, k) => {
      const y = 62 + k * 116;
      label(30, y + 50, n, svg, { "font-size": 17, "font-weight": 600, fill: ccol(k) });
      D.view_imgs[k].forEach((vs, s) => vs.forEach((u, m) => {
        const x = 175 + s * 205 + (m % 2) * 50, yy = y + Math.floor(m / 2) * 50;
        anim(img(u, x, yy, 46), "pop", (k * 5 + s) * 25 + m * 60);
      }));
    });
    D.view_names.forEach((v, m) => label(175 + (m % 2) * 50 + 23, 50 + Math.floor(m / 2) * 0, "", svg));
    label(175, 650, "2 × 2 block = one image's four views: " + D.view_names.join(" · "), svg, { "font-size": 13, class: "muted" });
  } },
{ short: "Backbone", eye: "Stage 3 · frozen backbone fθ", title: "Every view becomes a 512-number feature vector",
  text: "The ResNet-18, trained once on the 60 base classes and then frozen, maps each view to a feature vector. Each row below is one real vector: brighter cells are larger activations.",
  shape: "features  (5, 5, 4, 512)",
  facts: () => [["backbone parameters (frozen)", "11.2 M"], ["feature size", D.feat_dim]],
  draw() {
    const k = 3, shots = [0, 1, 2];  // porcupine
    shots.forEach((s, i) => D.view_imgs[k][s].forEach((u, m) => anim(img(u, 30 + m * 52, 80 + i * 180 + 0, 46), "pop", i * 200 + m * 50)));
    box(270, 250, 180, 110, "ResNet-18", "frozen · 11.2 M params");
    arrow(240, 305, 268, 305); arrow(452, 305, 500, 305);
    shots.forEach((s, i) => D.feats[k][s].forEach((f, m) => {
      const y = 70 + i * 180 + m * 38;
      anim(strip(f, 520, y, 620, 26), "fade", 300 + i * 220 + m * 70);
      label(1146, y + 18, "", svg);
    }));
    shots.forEach((s, i) => label(520, 62 + i * 180, `${D.classes[k]} · shot ${s + 1} · 4 views → 4 × 512`, svg, { "font-size": 13, class: "muted" }));
  } },
{ short: "Average", eye: "Stage 4 · shot averaging", title: "Five shots averaged into one vector per view",
  text: "For each class and view, the five shots are averaged. Twenty vectors remain: five classes × four views. At this point the classes are well apart.",
  shape: "w  (5 classes, 4 views, 512)  =  20 node features",
  facts: () => [["mean cosine between different classes", fmt(D.sim.f_between)], ["nodes for the graph", 20]],
  draw() {
    const k = 3;
    D.feats[k].forEach((sh, s) => anim(strip(sh[0], 60, 70 + s * 30, 420, 20), "fade", s * 80));
    label(60, 60, `${D.classes[k]}, view "identity": 5 shots`, svg, { "font-size": 13, class: "muted" });
    arrow(270, 225, 270, 262);
    label(285, 250, "mean", svg, { "font-size": 13, class: "muted" });
    anim(strip(D.w_all[k * 4], 60, 270, 420, 26, svg, { color: ccol(k) }), "pop", 500);
    label(560, 60, "all 20 node features w (rows: class × view)", svg, { "font-size": 13, class: "muted" });
    D.w_all.forEach((w, i) => {
      const c = D.node_class[i], y = 70 + i * 27;
      anim(strip(w, 640, y, 520, 20, svg, { color: ccol(c) }), "fade", 700 + i * 40);
      if (D.node_view[i] === 0) label(560, y + 15 + 20, D.classes[c], svg, { "font-size": 13, fill: ccol(c), "font-weight": 600 });
    });
  } },
{ short: "Project", eye: "Stage 5 · projection Wp", title: "Projected from 512 to 256 dimensions",
  text: "A learned linear projection maps each node to the head's 256-d space. The plot places the 20 nodes on their two main directions of variation. The classes are already drawn much closer together.",
  shape: "h⁽⁰⁾ = Wp w   (20, 256)",
  facts: () => [["mean cosine between classes, before", fmt(D.sim.f_between)], ["after projection", fmt(D.sim.h0_between)]],
  draw() {
    D.h0_all.forEach((h, i) => anim(strip(h, 30, 70 + i * 26, 330, 18, svg, { color: ccol(D.node_class[i]) }), "fade", i * 30));
    label(30, 60, "20 projected nodes h⁽⁰⁾ (256 values each)", svg, { "font-size": 13, class: "muted" });
    scatterFrame(svg, "2-D view of the 20 projected nodes");
    D.nodes_h0.forEach((p, i) => anim(marker(viewShape[D.node_view[i]], sx(p), sy(p), 9, ccol(D.node_class[i]), svg), "pop", 400 + i * 40));
    legendClasses(P0.x + P0.w - 150, P0.y + 50);
  } },
{ short: "Topology", eye: "Stage 6 · topology scorer gφ", title: "A learned score for every pair of nodes",
  text: "A small network scores how related each pair of nodes is (A_ij). Edge darkness below is the real score. It was trained to link nodes of the same class, but on new classes it scores almost every pair the same.",
  shape: "A = σ(gφ(h_i ‖ h_j))   (20, 20)",
  facts: () => {
    const A = D.A, c = D.node_class; let s = 0, ns = 0, d = 0, nd = 0;
    A.forEach((r, i) => r.forEach((v, j) => { if (i === j) return; if (c[i] === c[j]) { s += v; ns++ } else { d += v; nd++ } }));
    return [["mean A, same class", fmt(s / ns, 3)], ["mean A, different class", fmt(d / nd, 3)], ["range of A", fmt(Math.min(...A.flat()), 3) + "–" + fmt(Math.max(...A.flat()), 3)]];
  },
  draw() {
    const A = D.A, flat = A.flat(), lo = Math.min(...flat), hi = Math.max(...flat);
    // heat map
    const hx = 40, hy = 90, cs = 18;
    label(hx, hy - 14, "A (20 × 20), grouped by class", svg, { "font-size": 13, class: "muted" });
    A.forEach((r, i) => r.forEach((v, j) => anim(el("rect", { x: hx + j * cs, y: hy + i * cs, width: cs - 1, height: cs - 1,
      fill: mix(css("--seq0"), css("--seq1"), (v - lo) / (hi - lo)) }), "fade", (i + j) * 12)));
    D.classes.forEach((n, k) => el("rect", { x: hx - 8, y: hy + k * 4 * cs, width: 5, height: 4 * cs - 1, fill: ccol(k) }));
    scatterFrame(svg, "edges drawn with opacity ∝ A_ij");
    const eg = g({});
    for (let i = 0; i < 20; i++) for (let j = i + 1; j < 20; j++) {
      const t = (A[i][j] - lo) / (hi - lo);
      anim(el("line", { x1: sx(D.nodes_h0[i]), y1: sy(D.nodes_h0[i]), x2: sx(D.nodes_h0[j]), y2: sy(D.nodes_h0[j]),
        stroke: css("--ink"), "stroke-opacity": 0.04 + 0.5 * t, "stroke-width": 1 + 1.5 * t }, eg), "fade", 200 + (i * 20 + j) * 2);
    }
    D.nodes_h0.forEach((p, i) => marker(viewShape[D.node_view[i]], sx(p), sy(p), 9, ccol(D.node_class[i]), svg));
    legendClasses(P0.x + P0.w - 150, P0.y + 50);
  } },
{ short: "GATv2", eye: "Stage 7 · view-aware GATv2", title: "Message passing pulls every node to one point",
  text: "Graph attention updates each node from its neighbours, weighted by A and by which views the two nodes came from. Watch the nodes move to their refined positions: all twenty end up on the same point, whatever their class.",
  shape: "h = GATv2(h⁽⁰⁾, A, view pair)   (20, 256)",
  facts: () => [["mean cosine between classes, before", fmt(D.sim.h0_between)], ["after GATv2", "<b class='hot'>" + fmt(D.sim.h_between, 4) + "</b>"]],
  draw() {
    scatterFrame(svg, "nodes moving from h⁽⁰⁾ to refined h");
    const ms = D.nodes_h0.map((p, i) => ({ p0: p, p1: D.nodes_h[i], m: marker(viewShape[D.node_view[i]], sx(p), sy(p), 9, ccol(D.node_class[i]), svg), i }));
    legendClasses(P0.x + P0.w - 150, P0.y + 50);
    const cosT = el("text", { x: 40, y: 140, "font-size": 64, "font-weight": 700, class: "mono" }, svg, fmt(D.sim.h0_between, 3));
    label(40, 90, "mean cosine between different classes", svg, { "font-size": 15, class: "muted" });
    label(40, 180, "1.000 means the classes are indistinguishable", svg, { "font-size": 14, class: "muted" });
    const note = label(40, 260, "", svg, { "font-size": 18, "font-weight": 600, fill: css("--warn") });
    const place = (m, x, y, i) => {
      const kind = viewShape[D.node_view[i]];
      if (kind === "circle") { m.setAttribute("cx", x); m.setAttribute("cy", y); }
      else if (kind === "rect") { m.setAttribute("x", x - 9); m.setAttribute("y", y - 9); }
      else { const pts = kind === "diamond" ? [[0, -11], [11, 0], [0, 11], [-11, 0]] : [[0, -12], [11, 9], [-11, 9]];
        m.setAttribute("points", pts.map(p => `${x + p[0]},${y + p[1]}`).join(" ")); }
    };
    setTimeout(() => tween(2600, e => {
      ms.forEach(o => place(o.m, sx(o.p0) + (sx(o.p1) - sx(o.p0)) * e, sy(o.p0) + (sy(o.p1) - sy(o.p0)) * e, o.i));
      cosT.textContent = fmt(D.sim.h0_between + (D.sim.h_between - D.sim.h0_between) * e, 3);
    }, () => { note.textContent = "All 20 nodes now point the same way."; }), reduce ? 0 : 700);
  } },
{ short: "Pool", eye: "Stage 8 · view pooling", title: "Four views pooled into one prototype per class",
  text: "Each class prototype is the average of its four refined view nodes. Because the nodes have collapsed, the five prototypes are almost the same vector: compare the rows below.",
  shape: "P_c = mean over views of h   (5, 256)",
  facts: () => [["mean cosine between prototypes", "<b class='hot'>" + fmt(D.sim.P_between, 6) + "</b>"]],
  draw() {
    label(40, 70, "the five class prototypes P (256 values each, real)", svg, { "font-size": 13, class: "muted" });
    D.P_all.forEach((p, k) => {
      label(40, 112 + k * 60, D.classes[k], svg, { "font-size": 16, "font-weight": 600, fill: ccol(k) });
      anim(strip(p, 180, 92 + k * 60, 960, 30, svg, { color: ccol(k) }), "fade", k * 160);
    });
    label(40, 440, "For comparison, the NCM prototypes of the same classes (raw backbone means):", svg, { "font-size": 13, class: "muted" });
    D.classes.forEach((n, k) => anim(strip(D.R_all[novelIdx(k)].slice(0, 512), 180, 455 + k * 36, 960, 26, svg, { color: ccol(k) }), "fade", 900 + k * 120));
    D.classes.forEach((n, k) => label(40, 473 + k * 36, n, svg, { "font-size": 14, fill: ccol(k) }));
  } },
{ short: "Memory", eye: "Stage 9 · STI memory", title: "Prototypes are written into the memory",
  text: "The STI memory keeps one row per class seen so far. Session 1 adds five rows to the 60 base rows; by session 8 there are 100. Left: the head's memory H. Right: NCM's class means R. The head's rows are nearly identical; NCM's are not.",
  shape: "H  (60 → 65 → … → 100, 256)      R  (100, 512)",
  facts: () => [["rows after session 1", "65"], ["rows after session 8", "100"]],
  draw() {
    const top = 80, rh = 5;
    label(40, top - 14, "head memory H (rows: classes, cols: 256 dims)", svg, { "font-size": 13, class: "muted" });
    label(640, top - 14, "NCM means R (rows: classes, cols: 512 dims)", svg, { "font-size": 13, class: "muted" });
    const gH = g({}), gR = g({});
    const ctr = el("text", { x: 40, y: 640, "font-size": 15, class: "mono" }, svg, "");
    const drawRows = n => {
      gH.innerHTML = ""; gR.innerHTML = "";
      for (let r = 0; r < n; r++) {
        const nov = r >= D.n_base, k = r - D.n_base;
        const col = nov && k < 5 ? ccol(k) : (nov ? css("--accent") : css("--seq1"));
        strip(D.H_all[r], 40, top + r * rh, 540, rh, gH, { color: col });
        strip(D.R_all[r], 640, top + r * rh, 540, rh, gR, { color: col });
      }
      ctr.textContent = `session ${Math.max(0, (n - D.n_base) / 5)}: ${n} rows (${D.n_base} base + ${n - D.n_base} new)`;
    };
    drawRows(D.n_base);
    let n = D.n_base;
    const grow = () => { n += 5; drawRows(n); if (n < 100) timer = setTimeout(grow, reduce ? 0 : 450); };
    let timer = setTimeout(grow, reduce ? 0 : 600);
    cleanups.push(() => clearTimeout(timer));
  } },
{ short: "Query", eye: "Stage 10 · scoring a test image", title: "A test image scored two ways",
  text: "A test image of a plate goes through the same frozen backbone. The head compares its projection z with every row of H; NCM compares the raw feature f with every row of R. Same y-axis for both: the head's 100 scores are almost flat.",
  shape: "head: cos(z, H_c)        NCM: cos(f, R_c)        c = 1 … 100",
  facts: () => [["spread of head scores", "<b class='hot'>" + fmt(D.query.spread_head, 4) + "</b>"], ["spread of NCM scores", fmt(D.query.spread_ncm, 4)],
    ["true class", D.query.true]],
  draw() {
    const q = D.query;
    anim(img(q.img, 30, 230, 120), "pop", 0);
    label(30, 220, "test image: " + q.true, svg, { "font-size": 15, "font-weight": 600 });
    arrow(155, 290, 190, 290);
    box(195, 250, 120, 80, "fθ", "frozen");
    arrow(318, 290, 340, 170); arrow(318, 290, 340, 450);
    const chart = (vals, y0, title, color) => {
      const x0 = 360, w = 800, h = 190, n = vals.length, bw = w / n;
      label(x0, y0 - 10, title, svg, { "font-size": 14, "font-weight": 600 });
      el("line", { x1: x0, y1: y0 + h, x2: x0 + w, y2: y0 + h, stroke: css("--line") });
      [0, .5, 1].forEach(t => label(x0 - 8, y0 + h - t * h + 4, fmt(t, 1), svg, { "font-size": 11, class: "muted mono", "text-anchor": "end" }));
      vals.forEach((v, i) => {
        const hh = Math.max(1, v * h), novel = q.novel[i];
        const r = el("rect", { x: x0 + i * bw + 1, y: y0 + h - hh, width: bw - 2, height: hh,
          fill: i === q.true_pos ? css("--ok") : (novel ? color : css("--base")) });
        anim(r, "fade", i * 6);
      });
      el("line", { x1: x0 + D.n_base * bw, y1: y0, x2: x0 + D.n_base * bw, y2: y0 + h, stroke: css("--muted"), "stroke-dasharray": "3 4" });
      label(x0 + 4, y0 + h + 16, "60 base classes", svg, { "font-size": 11, class: "muted" });
      label(x0 + D.n_base * bw + 4, y0 + h + 16, "40 new classes", svg, { "font-size": 11, class: "muted" });
    };
    chart(q.s_head, 60, "STAG-STI head: cosine(z, H_c)", css("--accent"));
    chart(q.s_ncm, 360, "NCM: cosine(f, R_c)", css("--accent"));
    label(360, 650, "green bar = the true class (plate)", svg, { "font-size": 12, class: "muted" });
  } },
{ short: "Decision", eye: "Stage 11 · fusion and offset", title: "The fused score is NCM with a doubled offset",
  text: "Final score = (1/τ)(0.5 · head + 0.5 · NCM) + 0.5 for new classes. Since the head is almost constant, this equals NCM with the new-class offset doubled from 0.5 to 1. The two classifiers agree on nearly every test image.",
  shape: "s = τ⁻¹((1−λ)·head + λ·NCM) + b·[new class],   λ = 0.5, b = 0.5",
  facts: () => [["agreement with NCM at b = 1", "<b class='hot'>" + fmt(D.agreement, 2) + "%</b>"], ["over test images", "10,000"], ["1/τ", fmt(D.query.inv_tau, 2)]],
  draw() {
    const q = D.query, it = q.inv_tau;
    const sc = (lam, b) => q.s_ncm.map((v, i) => it * ((1 - lam) * q.s_head[i] + lam * v) + b * q.novel[i]);
    const cols = [["NCM, offset b = 0.5", sc(1, .5)], ["STAG-STI fused (λ = 0.5)", sc(.5, .5)], ["NCM, offset b = 1", sc(1, 1)]];
    anim(img(q.img, 40, 80, 120), "pop", 0);
    label(40, 70, "true: " + q.true, svg, { "font-size": 15, "font-weight": 600 });
    cols.forEach(([t, s], ci) => {
      const x = 220 + ci * 320, gg = g({});
      anim(gg, "fade", ci * 350);
      label(x, 70, t, gg, { "font-size": 16, "font-weight": 600 });
      const top = s.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]).slice(0, 5);
      const mx = top[0][0], mn = top[4][0] - 0.3;
      top.forEach(([v, i], r) => {
        const y = 92 + r * 46, w = 240 * (v - mn) / (mx - mn);
        const ok = i === q.true_pos;
        el("rect", { x, y, width: w, height: 30, rx: 4, fill: ok ? css("--ok") : (q.novel[i] ? css("--accent") : css("--base")), "fill-opacity": r === 0 ? 1 : .55 }, gg);
        label(x + 8, y + 20, q.names[i], gg, { "font-size": 14, "font-weight": r === 0 ? 700 : 400, fill: r === 0 ? css("--panel") : css("--ink") });
        label(x + 250, y + 20, fmt(v, 2), gg, { "font-size": 12, class: "mono muted" });
      });
      const win = q.names[top[0][1]], ok = top[0][1] === q.true_pos;
      label(x, 345, (ok ? "✓ " : "✗ ") + "predicts " + win, gg, { "font-size": 18, "font-weight": 700, fill: ok ? css("--ok") : css("--warn") });
    });
    const t = g({}); anim(t, "fade", 1300);
    el("rect", { x: 220, y: 400, width: 940, height: 190, rx: 10, fill: css("--bg"), stroke: css("--line") }, t);
    label(245, 440, "What this means", t, { "font-size": 18, "font-weight": 700 });
    label(245, 475, "The head's +3 HM over NCM comes from a larger offset on new classes, not from better recognition.", t, { "font-size": 15 });
    label(245, 503, "NCM with b = 1 makes the same decision as the fused head on " + fmt(D.agreement, 2) + "% of all 10,000 test images.", t, { "font-size": 15 });
    label(245, 531, "Control: compare every FSCIL head with NCM over a range of offsets on the same backbone.", t, { "font-size": 15, "font-weight": 600 });
    label(245, 565, "Bars: green = true class, blue = new class, grey = base class. Score = logit.", t, { "font-size": 12, class: "muted" });
  } },
];

// ---------------------------------------------------------------- player
const rail = document.getElementById("rail");
let cur = 0, playing = false, playTimer = 0, cleanups = [];
const DUR = [5000, 6000, 6500, 6500, 6500, 7000, 7500, 6500, 7500, 7500, 9000];
STAGES.forEach((s, i) => {
  const b = document.createElement("button");
  b.innerHTML = `<span class="n">${String(i + 1).padStart(2, "0")}</span>${s.short}`;
  b.addEventListener("click", () => { stop(); show(i); });
  rail.appendChild(b);
});
function show(i) {
  cleanups.forEach(f => f()); cleanups = []; cancelAnimationFrame(raf);
  cur = Math.max(0, Math.min(STAGES.length - 1, i));
  const s = STAGES[cur];
  svg.innerHTML = "";
  el("rect", { x: 0, y: 0, width: 1200, height: 660, fill: css("--panel") });
  s.draw();
  document.getElementById("capEye").textContent = s.eye;
  document.getElementById("capTitle").textContent = s.title;
  document.getElementById("capText").textContent = s.text;
  document.getElementById("capShape").textContent = s.shape;
  document.getElementById("capFacts").innerHTML = s.facts().map(([k, v]) => `<li><span>${k}</span><b>${v}</b></li>`).join("");
  [...rail.children].forEach((b, j) => { b.classList.toggle("on", j === cur); b.classList.toggle("done", j < cur); b.setAttribute("aria-current", j === cur ? "step" : "false"); });
  rail.children[cur].scrollIntoView({ block: "nearest", inline: "nearest" });
  document.getElementById("prog").style.width = ((cur + 1) / STAGES.length * 100) + "%";
  if (playing) { clearTimeout(playTimer); playTimer = setTimeout(() => cur < STAGES.length - 1 ? show(cur + 1) : stop(), DUR[cur]); }
}
function stop() { playing = false; clearTimeout(playTimer); document.getElementById("play").textContent = "Play"; }
function play() { if (playing) return stop(); playing = true; document.getElementById("play").textContent = "Pause"; show(cur >= STAGES.length - 1 ? 0 : cur); }
document.getElementById("play").addEventListener("click", play);
document.getElementById("next").addEventListener("click", () => { stop(); show(cur + 1); });
document.getElementById("prev").addEventListener("click", () => { stop(); show(cur - 1); });
document.getElementById("replay").addEventListener("click", () => show(cur));
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (e.key === "ArrowRight") { stop(); show(cur + 1); }
  else if (e.key === "ArrowLeft") { stop(); show(cur - 1); }
  else if (e.key === " ") { e.preventDefault(); play(); }
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(cur));
new MutationObserver(() => show(cur)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
show(0);
</script>
